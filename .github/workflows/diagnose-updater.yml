name: Diagnose released updater
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-updater.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Diagnose released 1.0.2 updater'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows UI diagnostics
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install pywin32==311 Pillow==11.3.0
          gh release download v1.0.2 --repo $env:GITHUB_REPOSITORY --dir Old --pattern BakuriSetup.exe --pattern '*Portable.zip'
          Expand-Archive (Get-ChildItem Old -Filter '*Portable.zip').FullName Old/Portable
      - name: Exercise real old executables
        shell: pwsh
        run: python tools/diagnose_released_updates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-updater-diagnostics
          path: UpdateDiagnostics/*
