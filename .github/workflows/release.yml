name: Windows installer and GitHub Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately (false creates an unpublished draft)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bakuri-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish Bakuri 1.0.4')
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      BAKURI_DISABLE_SHELL_INTEGRATION: '1'
      BAKURI_RELEASE_TARGET: 315ec0eb7b4cf1dd32364b53b35b013133460fed
      BAKURI_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Use clean release workflow in source archive
        shell: pwsh
        run: git checkout $env:BAKURI_RELEASE_TARGET -- .github/workflows/release.yml
      - name: Read app version
        id: app
        shell: pwsh
        run: |
          $Version=python -c "from version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $Version -notmatch '^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$') { throw 'Invalid version' }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Regression tests
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python verify_completion_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Native completion/layout verification failed' }
          python -c "import subprocess,sys; subprocess.run([sys.executable,'verify_reorder.py'],check=True,timeout=25)"
          if ($LASTEXITCODE -ne 0) { throw 'Native file drag verification failed' }
      - name: Build installer and update feed
        shell: pwsh
        run: ./build_release.ps1 -RepositoryUrl $env:BAKURI_REPOSITORY_URL
      - uses: actions/upload-artifact@v4
        with:
          name: Bakuri-v${{ steps.app.outputs.version }}-Windows
          path: Releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Create release with complete asset set
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAKURI_VERSION: ${{ steps.app.outputs.version }}
          BAKURI_PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: |
          $Tag="v$env:BAKURI_VERSION"
          $PreRelease=$env:BAKURI_VERSION.Contains('-')
          $Files=@(Get-ChildItem Releases -File | ForEach-Object FullName)
          $Existing=& gh release view $Tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($Existing | ConvertFrom-Json).isDraft) { throw 'A published version is immutable. Bump version.py.' }
            & gh release upload $Tag --repo $env:GITHUB_REPOSITORY --clobber @Files
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
            $Edit=@('release','edit',$Tag,'--repo',$env:GITHUB_REPOSITORY,'--title',"바꾸리 $env:BAKURI_VERSION",'--notes-file','RELEASE-NOTES.md')
            if ($env:BAKURI_PUBLISH -eq 'true') { $Edit+='--draft=false'; if ($PreRelease) { $Edit+=@('--prerelease','--latest=false') } else { $Edit+=@('--prerelease=false','--latest') } }
            & gh @Edit
            if ($LASTEXITCODE -ne 0) { throw 'Draft release update failed.' }
            exit 0
          }
          git show-ref --verify --quiet "refs/tags/$Tag"
          if ($LASTEXITCODE -ne 0) {
            git tag $Tag $env:BAKURI_RELEASE_TARGET
            if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed.' }
            git push origin "refs/tags/$Tag"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag push failed.' }
          }
          $Arguments=@('release','create',$Tag,'--verify-tag','--repo',$env:GITHUB_REPOSITORY,'--title',"바꾸리 $env:BAKURI_VERSION",'--notes-file','RELEASE-NOTES.md')
          if ($PreRelease) { $Arguments+=@('--prerelease','--latest=false') } elseif ($env:BAKURI_PUBLISH -eq 'true') { $Arguments+='--latest' }
          if ($env:BAKURI_PUBLISH -ne 'true') { $Arguments+='--draft' }
          & gh @Arguments @Files
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; do not overwrite an existing published version.' }
