name: Developer test build
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      BAKURI_DISABLE_SHELL_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
      - name: Architecture and formatting checks
        shell: pwsh
        run: |
          python -m ruff check bakuri tools test_application.py test_architecture.py app.py engine.py compression.py jobs.py rename_engine.py file_list.py rename_ui.py work_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
          python -m black --check bakuri tools app.py engine.py compression.py jobs.py rename_engine.py file_list.py rename_ui.py work_ui.py prepare_source.py test_application.py test_architecture.py
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
      - name: Tests
        shell: pwsh
        run: |
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python verify_popup.py
          if ($LASTEXITCODE -ne 0) { throw 'Native popup verification failed' }
          python verify_completion_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Native completion/layout verification failed' }
          python -c "import subprocess,sys; subprocess.run([sys.executable,'verify_reorder.py'],check=True,timeout=25)"
          if ($LASTEXITCODE -ne 0) { throw 'Native file drag verification failed' }
      - name: Build portable developer edition
        shell: pwsh
        run: ./build_dev.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bakuri-Development-0.15.0-dev.13
          path: DevArtifacts/*
          if-no-files-found: error
          retention-days: 30
