name: Publish prepared Bakuri 1.0.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-prepared.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish prepared Bakuri 1.0.3'
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01d0a2ece6852de9fa982977c82800973a0ae855
      - uses: actions/download-artifact@v4
        with:
          name: Bakuri-v1.0.3-Windows
          path: Releases
          run-id: 41991216684
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify prepared release files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Lines=Get-Content Releases/SHA256SUMS.txt
          foreach ($Line in $Lines) {
            if ($Line -notmatch '^([a-fA-F0-9]{64})\s+(.+)$') { throw 'Invalid checksum line' }
            $Expected=$Matches[1]
            $Name=$Matches[2].Trim()
            $File=Join-Path Releases $Name
            if ((Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash -ne $Expected) { throw "Checksum mismatch: $Name" }
          }
          foreach ($File in @('BakuriSetup.exe','releases.stable.json','Bakuri-Source-v1.0.3.zip','libredwg-0.14.tar.xz')) {
            if (-not (Test-Path (Join-Path Releases $File))) { throw "Missing release file: $File" }
          }
          if (-not (Get-ChildItem Releases -Filter '*-full.nupkg')) { throw 'Missing update package' }
      - name: Publish existing verified tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $Files=@(Get-ChildItem Releases -File | ForEach-Object FullName)
          gh release create v1.0.3 --verify-tag --repo $env:GITHUB_REPOSITORY --title '바꾸리 1.0.3' --notes-file RELEASE-NOTES.md --latest @Files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
