name: Publish verified Bakuri 1.0.5
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish105.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: bakuri-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30aa8f0cd4a26c7451c714a111c1431fdaaf08fb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and verify tested release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          gh run download 45336953011 --repo $env:GITHUB_REPOSITORY --name Bakuri-v1.0.5-Windows --dir Releases
          if ($LASTEXITCODE -ne 0) { throw 'Verified artifact download failed.' }
          foreach ($Line in Get-Content Releases/SHA256SUMS.txt) {
            if ($Line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum entry.' }
            $Expected=$Matches[1]; $Name=$Matches[2]
            $Actual=(Get-FileHash (Join-Path Releases $Name) -Algorithm SHA256).Hash.ToLower()
            if ($Actual -ne $Expected) { throw "Checksum mismatch: $Name" }
          }
          if ((python -c "from version import VERSION; print(VERSION)") -ne '1.0.5') { throw 'Unexpected source version.' }
          $Feed=Get-Content Releases/releases.stable.json -Raw | ConvertFrom-Json
          if (-not ($Feed.Assets | Where-Object { $_.Version -eq '1.0.5' -and $_.Type -eq 'Full' })) { throw 'Missing 1.0.5 full update package.' }
          # Match the accompanying source ZIP to the restored release commit.
          python prepare_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
          Copy-Item SourcePackages/Bakuri-Source-v1.0.5.zip Releases -Force
          Get-ChildItem Releases -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding UTF8 Releases/SHA256SUMS.txt
      - name: Publish complete verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $Files=@(Get-ChildItem Releases -File | ForEach-Object FullName)
          if ($Files.Count -ne 9) { throw 'Incomplete release asset set.' }
          gh release create v1.0.5 --repo $env:GITHUB_REPOSITORY --target 30aa8f0cd4a26c7451c714a111c1431fdaaf08fb --title '바꾸리 1.0.5' --notes-file RELEASE-NOTES.md --latest @Files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
