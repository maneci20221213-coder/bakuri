name: Windows installer and GitHub Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Bakuri-v1.0.1-Windows
          path: Releases
          run-id: 41773465343
          github-token: ${{ github.token }}
      - name: Verify installer and update assets
        shell: pwsh
        run: |
          foreach ($Line in Get-Content Releases/SHA256SUMS.txt) {
            if ($Line -notmatch '^([a-f0-9]{64})  ([^/\\]+)$') { throw 'Invalid checksum list.' }
            $Expected=$Matches[1]
            $File=Join-Path Releases $Matches[2]
            if ((Get-FileHash $File -Algorithm SHA256).Hash -ne $Expected) { throw "Hash mismatch $File" }
          }
      - name: Create release with complete asset set
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAKURI_VERSION: 1.0.1
          BAKURI_PUBLISH: 'true'
        run: |
          $Tag="v$env:BAKURI_VERSION"
          $PreRelease=$env:BAKURI_VERSION.Contains('-')
          $Files=@(Get-ChildItem Releases -File | ForEach-Object FullName)
          $Existing=& gh release view $Tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($Existing | ConvertFrom-Json).isDraft) { throw 'A published version is immutable. Bump version.py.' }
            & gh release upload $Tag --repo $env:GITHUB_REPOSITORY --clobber @Files
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
            $Edit=@('release','edit',$Tag,'--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',"바꾸리 $env:BAKURI_VERSION",'--notes-file','RELEASE-NOTES.md')
            if ($env:BAKURI_PUBLISH -eq 'true') { $Edit+='--draft=false'; if ($PreRelease) { $Edit+=@('--prerelease','--latest=false') } else { $Edit+=@('--prerelease=false','--latest') } }
            & gh @Edit
            if ($LASTEXITCODE -ne 0) { throw 'Draft release update failed.' }
            exit 0
          }
          git push origin '4405d048ebd0ad9a47d89aa046760b2767cfe347:refs/tags/v1.0.1'
          if ($LASTEXITCODE -ne 0) { throw 'Release tag creation failed.' }
          $Arguments=@('release','create',$Tag,'--repo',$env:GITHUB_REPOSITORY,'--verify-tag','--title',"바꾸리 $env:BAKURI_VERSION",'--notes-file','RELEASE-NOTES.md')
          if ($PreRelease) { $Arguments+=@('--prerelease','--latest=false') } elseif ($env:BAKURI_PUBLISH -eq 'true') { $Arguments+='--latest' }
          if ($env:BAKURI_PUBLISH -ne 'true') { $Arguments+='--draft' }
          & gh @Arguments @Files
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; do not overwrite an existing published version.' }
