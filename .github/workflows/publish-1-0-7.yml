name: Publish verified Bakuri 1.0.7
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1-0-7.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: bakuri-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0131f0f30a6e033a5402baaa5460b9f53819a15c
          persist-credentials: false
      - name: Verify and publish 1.0.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 45353546914 --repo $env:GITHUB_REPOSITORY --name Bakuri-v1.0.7-Windows --dir Releases
          if ($LASTEXITCODE -ne 0) { throw 'Verified artifact download failed.' }
          $Names = @(
            'assets.stable.json',
            'Bakuri-Source-v1.0.7.zip',
            'Bakuri.FileConverter-1.0.7-stable-full.nupkg',
            'Bakuri.FileConverter-stable-Portable.zip',
            'BakuriSetup.exe',
            'libredwg-0.14.tar.xz',
            'RELEASES-stable',
            'releases.stable.json'
          )
          $Seen = @{}
          foreach ($Line in Get-Content Releases/SHA256SUMS.txt) {
            if ($Line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum entry.' }
            $Hash = $Matches[1]
            $Name = $Matches[2]
            if ($Name -cnotin $Names -or $Seen.ContainsKey($Name)) { throw "Unexpected checksum entry: $Name" }
            if ((Get-FileHash -LiteralPath (Join-Path Releases $Name) -Algorithm SHA256).Hash -ine $Hash) { throw "Checksum mismatch: $Name" }
            $Seen[$Name] = $Hash
          }
          if ($Seen.Count -ne $Names.Count) { throw 'Incomplete release assets.' }
          $Package = $Names[2]
          $Update = (Get-Content Releases/releases.stable.json -Raw | ConvertFrom-Json).Assets
          if (-not ($Update | Where-Object { $_.Version -eq '1.0.7' -and $_.Type -eq 'Full' -and $_.FileName -ceq $Package -and $_.SHA256 -ieq $Seen[$Package] -and $_.Size -eq (Get-Item (Join-Path Releases $Package)).Length })) {
            throw 'Update manifest does not match the package.'
          }
          $Files = @($Names + 'SHA256SUMS.txt' | ForEach-Object { Join-Path Releases $_ })
          gh release create v1.0.7 --repo $env:GITHUB_REPOSITORY --target 0131f0f30a6e033a5402baaa5460b9f53819a15c --title '바꾸리 1.0.7' --notes-file RELEASE-NOTES.md --latest @Files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
